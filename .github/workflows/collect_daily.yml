name: Collect RSS Daily

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC ~ 9am ET (standard time)
  workflow_dispatch:

permissions:
  contents: write

# Shared with youtube_live_daily.yml: both push db.sqlite, so run one at a time
concurrency:
  group: db-sqlite-writer
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Resolve main when the job starts, not the SHA pinned at trigger time
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect feeds
        run: |
          python src/collect.py

      - name: Commit updated db
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add db.sqlite
          git commit -m "Update db" || echo "No changes"
          git push
